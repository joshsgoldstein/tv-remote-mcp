<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Home Control architecture</title>
  <desc id="desc">The web dashboard and assistant MCP tools share inventory, capabilities, and kill switches. Commands go through the Samsung adapter. LG, Sony, thermostats, and lights are planned integrations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#737373"/></marker>
  </defs>
  <g fill="none" stroke="#a3a3a3" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M180 76H226V130H270"/>
    <path d="M180 184H226V130H270"/>
    <path d="M530 130H590V76H630"/>
    <path d="M530 130H590V184H630" stroke-dasharray="5 5"/>
  </g>
  <g fill="#fafafa" stroke="#e5e5e5">
    <rect x="10" y="46" width="170" height="60" rx="10"/>
    <rect x="10" y="154" width="170" height="60" rx="10"/>
    <rect x="270" y="74" width="260" height="112" rx="10"/>
    <rect x="630" y="38" width="260" height="76" rx="10"/>
    <rect x="630" y="146" width="260" height="76" rx="10" stroke-dasharray="5 5"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#171717" font-size="17">
    <text x="95" y="82">Web dashboard</text>
    <text x="95" y="190">Assistant / MCP</text>
    <text x="400" y="105" font-weight="600">Home Control</text>
    <text x="400" y="134" fill="#525252" font-size="15">Inventory &amp; capabilities</text>
    <text x="400" y="161" fill="#525252" font-size="15">Device &amp; master kill switches</text>
    <text x="760" y="69" font-weight="600">Samsung TVs &amp; The Frame</text>
    <text x="760" y="95" fill="#525252" font-size="14">Implemented adapter</text>
    <text x="760" y="177">LG · Sony · thermostats · lights</text>
    <text x="760" y="203" fill="#737373" font-size="14">Planned / future adapters</text>
  </g>
</svg>
